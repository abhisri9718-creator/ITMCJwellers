<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITMC Jeweller App — Fine Gold & Diamond Jewellery</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ITMC Jeweller">
<meta name="application-name" content="ITMC Jeweller">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C1B3F; --navy-deep:#07112B; --navy-2:#16295C; --navy-3:#22377A;
  --gold:#B8893C; --gold-lt:#E3C47F; --gold-pale:#F3E6C4; --gold-dk:#8A6325;
  --ivory:#FBF8F2; --ivory-2:#F4EEE3; --white:#FFFFFF;
  --ink:#18203A; --muted:#666C80; --line:rgba(184,137,60,.28); --line-n:rgba(12,27,63,.10);
  --ruby:#8E1B2E; --ok:#2F6B4F;
  --serif:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --deva:"Tiro Devanagari Hindi", "Noto Serif Devanagari", serif;
  --r-sm:6px; --r:12px; --r-lg:22px;
  --sh:0 18px 50px -24px rgba(7,17,43,.35);
  --hdr:68px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0}
.deva{font-family:var(--deva)}
.wrap{width:min(1280px,100% - 40px);margin-inline:auto}
.muted{color:var(--muted)}
.gold-t{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 26px;border-radius:999px;font-weight:500;font-size:15px;letter-spacing:.02em;transition:background .25s,color .25s,border-color .25s,transform .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-gold{background:var(--gold);color:var(--white)}
.btn-gold:hover{background:var(--gold-dk)}
.btn-navy{background:var(--navy);color:var(--white)}
.btn-navy:hover{background:var(--navy-2)}
.btn-line{border:1px solid currentColor}
.btn-line:hover{background:rgba(184,137,60,.12)}
.btn-ghost-l{border:1px solid rgba(227,196,127,.55);color:var(--gold-pale)}
.btn-ghost-l:hover{background:rgba(227,196,127,.12)}
.btn-sm{height:38px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
.link{color:var(--gold-dk);border-bottom:1px solid var(--line);padding-bottom:1px;font-weight:500}
.link:hover{border-color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-n);background:var(--white);font-size:14px;transition:all .2s;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--white)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--gold-pale);color:var(--gold-dk);letter-spacing:.02em}
.badge.demo{background:var(--ruby);color:#fff}
.badge.navy{background:var(--navy);color:var(--gold-lt)}

/* ---------- top strip / header ---------- */
.strip{background:var(--navy-deep);color:var(--gold-pale);font-size:13px}
.strip .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:38px}
.strip .rates{display:flex;gap:18px;align-items:center;white-space:nowrap;overflow:hidden}
.strip b{color:var(--white);font-weight:500}
.strip .live{display:inline-flex;align-items:center;gap:6px}
.strip .live i{width:7px;height:7px;border-radius:50%;background:#5BD08A;box-shadow:0 0 0 0 rgba(91,208,138,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(91,208,138,0)}100%{box-shadow:0 0 0 0 rgba(91,208,138,0)}}
.strip .right{display:flex;gap:18px}
.strip .right a:hover{color:var(--white)}
header.hdr{position:sticky;top:0;z-index:50;background:var(--navy);color:var(--white);border-bottom:1px solid rgba(227,196,127,.18)}
.hdr .wrap{height:var(--hdr);display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo svg{width:36px;height:36px}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:.01em;color:var(--white)}
.logo .wm small{font-family:var(--deva);color:var(--gold-lt);font-size:12px;margin-top:4px;letter-spacing:.06em}
nav.main{display:flex;gap:4px;flex:1;justify-content:center}
nav.main a{padding:8px 12px;font-size:15px;color:rgba(255,255,255,.86);border-radius:8px;position:relative;display:inline-flex;align-items:center;gap:6px}
nav.main a:hover,nav.main a.act{color:var(--gold-lt)}
nav.main a .ar{font-size:10px;font-weight:600;background:var(--gold);color:var(--navy-deep);padding:1px 6px;border-radius:999px;letter-spacing:.04em}
.hdr-icons{display:flex;gap:4px;align-items:center}
.ico{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;position:relative;color:rgba(255,255,255,.9)}
.ico:hover{background:rgba(255,255,255,.08);color:var(--gold-lt)}
.ico svg{width:21px;height:21px}
.ico .cnt{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--gold);color:var(--navy-deep);font-size:11px;font-weight:600;display:grid;place-items:center;line-height:1}
.burger{display:none}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--ivory);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:var(--sh);display:none}
.mega.open{display:block;animation:dropIn .25s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mega .wrap{height:auto;padding:28px 0;display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.mega a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;text-align:center}
.mega a .t{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--white);border:1px solid var(--line);transition:border-color .2s}
.mega a:hover .t{border-color:var(--gold)}
.search-bar{background:var(--navy-2);display:none}
.search-bar.open{display:block}
.search-bar .wrap{height:auto;padding:14px 0;display:flex;gap:10px}
.search-bar input{flex:1;height:46px;border-radius:999px;border:1px solid rgba(227,196,127,.4);background:var(--navy-deep);color:#fff;padding:0 20px}
.search-bar input::placeholder{color:rgba(255,255,255,.5)}

/* drawer */
.drawer{position:fixed;inset:0;z-index:90;pointer-events:none}
.drawer .scrim{position:absolute;inset:0;background:rgba(7,17,43,.5);opacity:0;transition:opacity .3s}
.drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--navy);color:#fff;transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px) + 20px) 22px 24px;overflow:auto}
.drawer.open{pointer-events:auto}
.drawer.open .scrim{opacity:1}
.drawer.open .panel{transform:none}
.drawer .panel a{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid rgba(227,196,127,.14);font-size:17px}
.drawer .panel h4{font-family:var(--sans);font-size:13px;color:var(--gold-lt);margin:22px 0 4px;font-weight:500}
.drawer .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.drawer .cats a{flex-direction:column;border:0;padding:0;font-size:12px;gap:6px;text-align:center}
.drawer .cats .t{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--ivory)}

/* bottom nav */
.bnav{display:none}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--navy);color:var(--white);overflow:hidden}
.hero .jali{position:absolute;inset:0;opacity:.07;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.02fr 1fr;gap:40px;align-items:center;min-height:min(78vh,720px);padding:56px 0 64px}
.hero h1{font-size:clamp(40px,5.4vw,78px);font-weight:400;line-height:1.02;letter-spacing:-.02em}
.hero h1 .l2{display:block}
.hero .kick{font-family:var(--deva);color:var(--gold-lt);font-size:20px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.hero .kick::before{content:"";width:36px;height:1px;background:var(--gold)}
.hero p.lead{margin-top:22px;max-width:520px;color:rgba(255,255,255,.76);font-size:18px;font-weight:300}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hero .assist{margin-top:34px;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;border:1px solid rgba(227,196,127,.3);border-radius:18px;max-width:520px;background:rgba(7,17,43,.4);cursor:pointer;transition:border-color .2s;text-align:left;width:100%}
.hero .assist:hover{border-color:var(--gold-lt)}
.hero .assist .av{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--navy-deep)}
.hero .assist .q{font-size:15px;color:#fff}
.hero .assist .q > span:last-child{display:block;color:rgba(255,255,255,.6);font-size:13px;margin-top:2px}
.hero .assist .typed{border-right:1px solid var(--gold-lt);padding-right:3px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}
.hero-art{position:relative;aspect-ratio:1/1.02;width:100%;max-width:600px;justify-self:center}
.hero-art .halo{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(227,196,127,.22),rgba(227,196,127,0) 62%)}
.hero-art .ring-o{position:absolute;inset:2%;border:1px solid rgba(227,196,127,.22);border-radius:50%}
.hero-art .ring-o.b{inset:12%;border-style:dashed;border-color:rgba(227,196,127,.14);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art .main{position:absolute;inset:0}
.hero-art .tag{position:absolute;background:rgba(251,248,242,.97);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .2s}
.hero-art .tag:hover{transform:translateY(-3px)}
.hero-art .tag b{font-family:var(--serif);font-weight:500;font-size:16px;display:block}
.hero-art .tag.t1{left:-4%;bottom:14%}
.hero-art .tag.t2{right:-2%;top:12%}
.hero-art .tag .mini{width:58px;height:58px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--navy-2);position:relative}
.hero-art .tag .rec{position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;background:#E5484D;animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{opacity:.3}}
/* entrance: one orchestrated moment */
.draw path.chainp{stroke-dasharray:1400;stroke-dashoffset:1400;animation:drawIn 2.2s .2s cubic-bezier(.6,0,.2,1) forwards}
.draw .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:popIn .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.shine{animation:shineMove 5s 2.6s ease-in-out infinite}
@keyframes shineMove{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw path.chainp{stroke-dashoffset:0}.draw .pop{opacity:1}}

.trust{background:var(--navy-deep);color:rgba(255,255,255,.82);font-size:14px}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:18px 0}
.trust div{display:flex;align-items:center;gap:12px}
.trust svg{width:26px;height:26px;color:var(--gold-lt);flex-shrink:0}

/* ---------- sections ---------- */
section.s{padding:88px 0}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:38px}
.s-head h2{font-size:clamp(30px,3.6vw,48px)}
.s-head p{color:var(--muted);margin-top:10px;max-width:560px}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold);margin-bottom:14px}
.orn::before,.orn::after{content:"";height:1px;width:28px;background:currentColor;opacity:.6}
.orn svg{width:14px;height:14px}

.cat-rail{display:grid;grid-template-columns:repeat(8,1fr);gap:18px}
.cat-rail a{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cat-rail .t{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--white);border:1px solid var(--line);transition:transform .35s,border-color .3s}
.cat-rail a:hover .t{transform:translateY(-4px);border-color:var(--gold)}
.cat-rail span{font-family:var(--serif);font-size:18px}
.cat-rail small{display:block;color:var(--muted);font-size:13px;font-family:var(--sans)}

/* feature duo */
.duo{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.feat{border-radius:var(--r-lg);overflow:hidden;position:relative;min-height:440px;display:flex}
.feat.ar{background:var(--navy);color:#fff}
.feat.ai{background:var(--white);border:1px solid var(--line)}
.feat .copy{padding:44px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;position:relative;z-index:2;max-width:420px}
.feat h3{font-size:clamp(28px,3vw,40px)}
.feat p{opacity:.78}
.feat .vis{position:absolute;inset:0}
.feat.ar .vis{left:42%}
.feat.ar .scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-lt),transparent);animation:scan 3.2s ease-in-out infinite;top:20%}
@keyframes scan{50%{top:78%}}
.chatdemo{display:flex;flex-direction:column;gap:10px;padding:34px 34px 0}
.bub{max-width:86%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.5}
.bub.u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.bub.b{align-self:flex-start;background:var(--ivory-2);border-bottom-left-radius:5px}
.feat.ai .copy{max-width:none;padding-top:20px}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 22px}
.pc{position:relative;display:flex;flex-direction:column;cursor:pointer}
.pc .img{position:relative;aspect-ratio:1/1.08;border-radius:var(--r);overflow:hidden;background:var(--white);border:1px solid rgba(184,137,60,.16)}
.pc .img svg{width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.pc:hover .img svg{transform:scale(1.06)}
.pc .wl{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--navy);z-index:2}
.pc .wl svg{width:18px;height:18px}
.pc .wl.on{color:var(--ruby)}
.pc .wl.on svg path{fill:currentColor}
.pc .tg{position:absolute;top:12px;left:12px;z-index:2}
.pc .try{position:absolute;left:10px;bottom:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--navy);color:var(--gold-pale);font-size:12.5px;opacity:0;transform:translateY(6px);transition:all .25s}
.pc:hover .try{opacity:1;transform:none}
.pc .try svg{width:14px;height:14px}
.pc .meta{padding:14px 2px 0}
.pc .nm{font-family:var(--serif);font-size:18.5px;line-height:1.25}
.pc .sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.pc .pr{margin-top:8px;font-weight:500;font-size:16.5px;display:flex;align-items:center;gap:8px}
.pc .pr s{color:var(--muted);font-weight:400;font-size:13.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}

/* festive */
.festive{background:var(--navy-deep);color:#fff;position:relative;overflow:hidden}
.festive .wrap{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;padding:90px 0}
.festive h2{font-size:clamp(36px,4.6vw,64px)}
.festive h2 .deva{display:block;color:var(--gold-lt);font-size:.62em;margin-bottom:8px}
.festive .offer{margin-top:22px;font-size:18px;color:rgba(255,255,255,.8);max-width:480px}
.countdown{display:flex;gap:12px;margin:30px 0}
.countdown div{border:1px solid rgba(227,196,127,.35);border-radius:12px;padding:12px 16px;min-width:76px;text-align:center}
.countdown b{display:block;font-family:var(--serif);font-size:32px;font-weight:400;color:var(--gold-lt);line-height:1.1}
.countdown span{font-size:12px;color:rgba(255,255,255,.6)}
.festive .art{position:relative;aspect-ratio:1;max-width:520px;justify-self:center;width:100%}
.diya-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,rgba(255,180,80,.28),transparent 55%)}

/* collections */
.colls{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.coll{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:3/4;cursor:pointer;color:#fff}
.coll .bg{position:absolute;inset:0}
.coll .bg svg{width:100%;height:100%;transition:transform 1s}
.coll:hover .bg svg{transform:scale(1.05)}
.coll .c{position:absolute;inset:auto 0 0;padding:28px;background:linear-gradient(transparent,rgba(7,17,43,.88))}
.coll h3{font-size:32px}
.coll .c p{opacity:.8;font-size:15px;margin-top:6px}
.coll .c .link{color:var(--gold-lt);border-color:rgba(227,196,127,.4);display:inline-block;margin-top:14px}

/* gold widget */
.goldbox{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:grid;grid-template-columns:1fr 1.15fr}
.goldbox .l{background:var(--navy);color:#fff;padding:38px}
.goldbox .r{padding:38px}
.rate-row{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(227,196,127,.18)}
.rate-row .k{font-family:var(--serif);font-size:22px}
.rate-row .k small{display:block;font-family:var(--sans);font-size:12.5px;color:rgba(255,255,255,.55)}
.rate-row .v{font-size:26px;font-weight:500;font-family:var(--serif);color:var(--gold-lt);transition:color .4s}
.rate-row .v.flash{color:#fff}
.rate-row .d{font-size:13px;margin-left:8px;font-family:var(--sans)}
.up{color:#6FD39A}.dn{color:#FF8A8A}
.calc{display:grid;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;color:var(--muted);font-weight:500}
.inp{height:48px;border:1px solid var(--line-n);border-radius:10px;background:var(--white);padding:0 14px;width:100%;transition:border-color .2s}
textarea.inp{height:auto;padding:12px 14px;min-height:110px;resize:vertical}
.inp:focus{border-color:var(--gold);outline:none}
.seg{display:flex;background:var(--ivory-2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;height:38px;border-radius:999px;font-size:14px;padding:0 12px}
.seg button.on{background:var(--navy);color:#fff}
.breakup{background:var(--ivory);border-radius:var(--r);padding:16px 18px;font-size:14.5px}
.breakup .ln{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.breakup .ln:last-child{border:0;font-weight:600;font-size:17px;padding-top:12px}
.breakup .ln span:first-child{color:var(--muted)}
.breakup .ln:last-child span:first-child{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--gold)}

.duo2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel-c{border-radius:var(--r-lg);padding:40px;position:relative;overflow:hidden;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.panel-c.iv{background:var(--ivory-2)}
.panel-c.nv{background:var(--navy-2);color:#fff}
.panel-c h3{font-size:34px;max-width:360px}
.panel-c p{max-width:380px;opacity:.8}
.panel-c .vis{position:absolute;right:-20px;top:-10px;width:52%;opacity:.95}
.panel-c > *:not(.vis){position:relative;z-index:1}

.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.quote{padding:30px;border-top:1px solid var(--gold)}
.quote p{font-family:var(--serif);font-size:20px;line-height:1.45}
.quote .who{margin-top:18px;font-size:14px;color:var(--muted)}

footer.ft{background:var(--navy-deep);color:rgba(255,255,255,.72);padding:70px 0 120px;font-size:14.5px}
.ft .cols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:36px}
.ft h5{font-family:var(--sans);font-weight:500;color:var(--gold-lt);font-size:14px;margin:0 0 14px}
.ft a{display:block;padding:4px 0}
.ft a:hover{color:#fff}
.ft .bot{border-top:1px solid rgba(227,196,127,.14);margin-top:44px;padding-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px}

/* ---------- listing ---------- */
.pagehead{background:var(--navy);color:#fff;padding:44px 0 40px}
.pagehead h1{font-size:clamp(34px,4.4vw,56px)}
.pagehead p{color:rgba(255,255,255,.7);margin-top:10px;max-width:640px}
.crumbs{font-size:13.5px;color:rgba(255,255,255,.55);margin-bottom:14px}
.crumbs a:hover{color:var(--gold-lt)}
.catbar{display:flex;gap:8px;overflow-x:auto;padding:20px 0;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.shop{display:grid;grid-template-columns:270px 1fr;gap:40px;padding-bottom:80px}
.filters{position:sticky;top:calc(var(--hdr) + 20px);align-self:start;max-height:calc(100vh - var(--hdr) - 40px);overflow:auto;padding-right:6px}
.fgroup{border-bottom:1px solid var(--line);padding:18px 0}
.fgroup h4{font-family:var(--sans);font-size:15px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between}
.fopt{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14.5px;cursor:pointer}
.fopt input{accent-color:var(--navy);width:17px;height:17px}
.fopt .n{margin-left:auto;color:var(--muted);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.toolbar select{height:42px;border-radius:999px;border:1px solid var(--line-n);padding:0 16px;background:var(--white)}
.actfil{display:flex;gap:8px;flex-wrap:wrap}
.actfil .chip{height:30px;font-size:13px;background:var(--gold-pale);border-color:transparent}
.fbtn{display:none}
.empty{padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty h3{font-size:28px;margin-bottom:10px}

/* ---------- PDP ---------- */
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding:34px 0 70px}
.gal{display:grid;grid-template-columns:84px 1fr;gap:14px;align-self:start;position:sticky;top:calc(var(--hdr) + 20px)}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumbs button{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--white);position:relative}
.thumbs button.on{border:2px solid var(--gold)}
.thumbs .lbl{position:absolute;inset:auto 0 0;font-size:10px;background:rgba(12,27,63,.8);color:#fff;padding:2px 0}
.stage{position:relative;aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;background:var(--white);border:1px solid var(--line);cursor:zoom-in}
.stage .zin{width:100%;height:100%;transition:transform .2s ease-out}
.stage .zin svg{width:100%;height:100%}
.stage.zoomed .zin{transform:scale(2.3)}
.stage .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(12,27,63,.82);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.stage.r360{cursor:grab;perspective:900px}
.stage.r360 .zin{transition:none;transform-style:preserve-3d}
.spin-ctl{position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);border-radius:999px;padding:8px 16px;font-size:13px}
.pdp h1{font-size:clamp(30px,3.2vw,44px)}
.rating{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:12px}
.stars{color:var(--gold);letter-spacing:2px}
.pprice{font-family:var(--serif);font-size:38px;margin-top:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pprice small{font-family:var(--sans);font-size:13.5px;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:24px 0}
.specs div{background:var(--white);padding:14px 12px;text-align:center}
.specs b{display:block;font-family:var(--serif);font-weight:500;font-size:18px}
.specs span{font-size:12.5px;color:var(--muted)}
.opts{margin:18px 0}
.opts h4{font-family:var(--sans);font-size:14px;font-weight:500;margin-bottom:10px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-n);font-size:14px}
.sizes button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-n);border-radius:999px;height:46px;background:#fff}
.qty button{width:42px;height:100%;font-size:18px}
.qty span{min-width:28px;text-align:center;font-weight:500}
.buyrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.buyrow .btn{flex:1;min-width:160px}
.sidebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.sidebtns button{border:1px solid var(--line);border-radius:12px;padding:12px 8px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff}
.sidebtns button:hover{border-color:var(--gold)}
.sidebtns svg{width:20px;height:20px;color:var(--gold-dk)}
.certs{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.cert{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;flex:1;min-width:200px;background:#fff}
.cert svg{width:30px;height:30px;color:var(--gold-dk);flex-shrink:0}
.cert b{display:block;font-weight:500;font-size:14px}
.acc{border-top:1px solid var(--line);margin-top:24px}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{padding:16px 0;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
.acc summary::after{content:"+";color:var(--gold);font-size:20px;line-height:1}
.acc details[open] summary::after{content:"–"}
.acc .bd{padding:0 0 18px;color:var(--muted);font-size:14.5px}
.pin{display:flex;gap:8px;margin-top:8px}
.pin .inp{height:44px}

/* ---------- cart / checkout ---------- */
.cartg{display:grid;grid-template-columns:1fr 400px;gap:40px;padding:40px 0 90px;align-items:start}
.citem{display:grid;grid-template-columns:120px 1fr auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
.citem .t{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer}
.citem h4{font-size:20px;cursor:pointer}
.citem .rm{font-size:13px;color:var(--muted);text-decoration:underline;margin-top:8px}
.summary{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;position:sticky;top:calc(var(--hdr) + 20px)}
.summary h3{font-size:26px;margin-bottom:16px}
.sumln{display:flex;justify-content:space-between;padding:8px 0;font-size:15px}
.sumln.tot{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-size:20px;font-family:var(--serif)}
.coupon{display:flex;gap:8px;margin:16px 0}
.coupon .inp{height:44px;text-transform:uppercase}
.steps{display:flex;gap:6px;margin-bottom:30px}
.steps div{flex:1;font-size:13px;color:var(--muted);padding-top:10px;border-top:3px solid var(--line-n)}
.steps div.on{border-color:var(--gold);color:var(--ink);font-weight:500}
.steps div.done{border-color:var(--navy);color:var(--ink)}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
.box h3{font-size:26px;margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.radio-c{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line-n);border-radius:14px;padding:16px 18px;cursor:pointer;margin-bottom:10px;transition:border-color .2s}
.radio-c.on{border-color:var(--gold);background:rgba(243,230,196,.35)}
.radio-c input{accent-color:var(--navy);margin-top:4px;width:18px;height:18px}
.radio-c b{font-weight:500}
.radio-c small{display:block;color:var(--muted);font-size:13.5px}
.paygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.paygrid button{border:1px solid var(--line-n);border-radius:12px;padding:14px 8px;font-size:14px;background:#fff}
.paygrid button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.processing{position:fixed;inset:0;z-index:120;background:rgba(7,17,43,.86);display:grid;place-items:center;color:#fff;text-align:center}
.spinner{width:64px;height:64px;border-radius:50%;border:2px solid rgba(227,196,127,.25);border-top-color:var(--gold-lt);animation:spin 1s linear infinite;margin:0 auto 22px}
.confirm{text-align:center;padding:70px 0 40px;max-width:720px;margin:0 auto}
.confirm .seal{width:110px;height:110px;margin:0 auto 26px}
.confirm h1{font-size:clamp(34px,4vw,52px)}
.timeline{display:flex;justify-content:space-between;margin:40px 0;position:relative}
.timeline::before{content:"";position:absolute;top:13px;left:8%;right:8%;height:2px;background:var(--line)}
.timeline div{position:relative;flex:1;font-size:13px;color:var(--muted)}
.timeline i{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:block;margin:0 auto 8px}
.timeline .on i{background:var(--gold);border-color:var(--gold)}
.timeline .on{color:var(--ink)}

/* ---------- account ---------- */
.acct{display:grid;grid-template-columns:260px 1fr;gap:40px;padding:40px 0 90px}
.side-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--hdr) + 20px);align-self:start}
.side-nav button{text-align:left;padding:12px 16px;border-radius:10px;font-size:15px;display:flex;justify-content:space-between}
.side-nav button.on{background:var(--navy);color:#fff}
.side-nav button:not(.on):hover{background:var(--ivory-2)}
.tier{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:30px;position:relative;overflow:hidden}
.tier .pts{font-family:var(--serif);font-size:56px;color:var(--gold-lt);line-height:1}
.prog{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold-lt);border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.kpi span{font-size:13.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;margin-top:4px}
.kpi small{font-size:13px}
.ord{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:20px;margin-bottom:14px;display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center}
.ord .t{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--ivory)}
.status{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--gold-pale);color:var(--gold-dk);font-weight:500;white-space:nowrap}
.status.ok{background:#DDEFE5;color:var(--ok)}
.status.nv{background:#E2E7F4;color:var(--navy-2)}
.status.rd{background:#F6DCDF;color:var(--ruby)}
.refcode{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px dashed var(--gold);border-radius:14px;padding:16px 20px;font-family:var(--serif);font-size:26px;letter-spacing:.08em;background:#fff}

/* ---------- forms pages ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:44px 0 90px;align-items:start}
.drop{border:1.5px dashed var(--gold);border-radius:var(--r-lg);padding:36px;text-align:center;background:#fff;cursor:pointer;transition:background .2s;position:relative}
.drop:hover,.drop.over{background:rgba(243,230,196,.35)}
.drop svg{width:40px;height:40px;color:var(--gold);margin:0 auto 10px}
.drop .prev{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.drop .prev img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.typegrid button{border:1px solid var(--line-n);border-radius:14px;padding:10px 6px 12px;font-size:13px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.typegrid button .t{width:56px;height:56px;border-radius:50%;overflow:hidden}
.typegrid button.on{border-color:var(--gold);background:rgba(243,230,196,.4)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{min-width:68px;border:1px solid var(--line-n);border-radius:14px;padding:10px 8px;text-align:center;background:#fff;font-size:12.5px}
.days button b{display:block;font-family:var(--serif);font-size:24px;font-weight:400}
.days button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots button{height:42px;border:1px solid var(--line-n);border-radius:10px;font-size:14px;background:#fff}
.slots button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.slots button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.experts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.experts button{border:1px solid var(--line-n);border-radius:14px;padding:14px 10px;background:#fff;text-align:center;font-size:13px}
.experts button.on{border-color:var(--gold);background:rgba(243,230,196,.4)}
.experts .av{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-family:var(--serif);font-size:20px;color:var(--gold-lt);background:var(--navy)}
.experts b{display:block;font-weight:500;font-size:14px}
.callmock{background:var(--navy-deep);border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:4/3;color:#fff}

/* stores */
.stores{display:grid;grid-template-columns:420px 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#fff;margin:30px 0 90px;min-height:620px}
.slist{overflow:auto;max-height:720px}
.store{padding:22px 24px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.store.on{background:rgba(243,230,196,.4);box-shadow:inset 3px 0 0 var(--gold)}
.store h4{font-size:21px}
.store p{font-size:14px;color:var(--muted);margin-top:4px}
.store .srv{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mapv{background:var(--navy);position:relative;min-height:420px}
.mapv .pinm{position:absolute;transform:translate(-50%,-100%);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gold-lt);font-size:12px}
.mapv .pinm i{width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);border:2px solid var(--navy-deep);display:block}
.mapv .pinm.on i{background:#fff;width:22px;height:22px}
.mapv .pinm span{background:rgba(7,17,43,.8);padding:2px 8px;border-radius:999px;white-space:nowrap}
.mapcard{position:absolute;left:20px;right:20px;bottom:20px;background:var(--ivory);color:var(--ink);border-radius:var(--r);padding:20px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}

/* ---------- Try-on ---------- */
.tryon{background:var(--navy-deep);color:#fff;min-height:calc(100vh - var(--hdr) - 38px)}
.tryon .wrap{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:28px 0 40px}
.tstage{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#000;aspect-ratio:4/5;width:min(100%,calc((100vh - 150px) * .8));justify-self:center;touch-action:none;user-select:none}
.tstage video,.tstage .model{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tstage video{transform:scaleX(-1)}
.tstage .model svg{width:100%;height:100%}
.tstage .ov{position:absolute;transform:translate(-50%,-50%);cursor:grab;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));transition:opacity .4s}
.tstage .ov svg{width:100%;height:100%;overflow:visible}
.tstage .ov.hide{opacity:0}
.tstage .ov.sel{outline:1px dashed rgba(227,196,127,.8);outline-offset:4px;border-radius:8px}
.tstage .lm{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.tstage .lm i{display:block;width:10px;height:10px;border-radius:50%;border:2px solid var(--gold-lt);background:rgba(227,196,127,.3);animation:lmPop .5s ease both}
.tstage .lm span{position:absolute;left:14px;top:-6px;font-size:11px;white-space:nowrap;background:rgba(7,17,43,.75);padding:1px 7px;border-radius:999px;color:var(--gold-pale)}
@keyframes lmPop{from{transform:scale(0)}to{transform:none}}
.tstage .mesh{position:absolute;inset:0;pointer-events:none}
.tstage .scan{position:absolute;left:0;right:0;height:120px;top:0;background:linear-gradient(transparent,rgba(227,196,127,.22),transparent);animation:scanY 1.6s ease-in-out infinite}
@keyframes scanY{0%{top:-120px}100%{top:100%}}
.thud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;flex-wrap:wrap}
.thud .pill{background:rgba(7,17,43,.72);backdrop-filter:blur(6px);border:1px solid rgba(227,196,127,.3);padding:6px 12px;border-radius:999px;font-size:12.5px;display:flex;align-items:center;gap:8px}
.thud .pill i{width:8px;height:8px;border-radius:50%;background:#5BD08A}
.tctl{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:12px;align-items:center}
.shutter{width:68px;height:68px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.shutter i{width:52px;height:52px;border-radius:50%;background:#fff;display:block;transition:transform .15s}
.shutter:active i{transform:scale(.9)}
.rbtn{width:46px;height:46px;border-radius:50%;background:rgba(7,17,43,.7);border:1px solid rgba(227,196,127,.35);display:grid;place-items:center}
.rbtn svg{width:20px;height:20px}
.perm{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,17,43,.82);backdrop-filter:blur(4px);z-index:5;padding:24px}
.perm .card{background:var(--ivory);color:var(--ink);border-radius:var(--r-lg);padding:30px;max-width:400px;text-align:center}
.perm .card h3{font-size:28px;margin:10px 0}
.perm .card p{color:var(--muted);font-size:14.5px}
.perm .card .btn{margin-top:12px}
.tpanel{display:flex;flex-direction:column;gap:18px}
.tpanel h2{font-size:34px}
.zone{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:rgba(255,255,255,.06);border-radius:16px;padding:6px}
.zone button{border-radius:12px;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,.75)}
.zone button svg{width:22px;height:22px}
.zone button.on{background:var(--gold);color:var(--navy-deep)}
.tlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tlist button{border-radius:14px;overflow:hidden;background:var(--ivory);border:2px solid transparent;position:relative;aspect-ratio:1}
.tlist button.on{border-color:var(--gold-lt)}
.tlist button .ck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--navy-deep);display:none;place-items:center;font-size:12px}
.tlist button.on .ck{display:grid}
.tinfo{background:rgba(255,255,255,.06);border:1px solid rgba(227,196,127,.2);border-radius:16px;padding:18px}
.tinfo h4{font-size:22px}
.tinfo .row{display:flex;gap:8px;margin-top:14px}
.tinfo .row .btn{flex:1}
.adj{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.7)}
.adj input{flex:1}
.wear{display:flex;flex-wrap:wrap;gap:6px}
.wear .chip{background:rgba(255,255,255,.08);border-color:rgba(227,196,127,.3);color:#fff;height:30px;font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:20px;background:rgba(7,17,43,.7);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .mc{background:var(--ivory);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:26px;position:relative;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.modal .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:var(--ivory-2);display:grid;place-items:center;font-size:20px}
.snap img{border-radius:var(--r);width:100%}
.wa{background:#1F8F55;color:#fff}
.wa:hover{background:#17744A}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;animation:rise .3s;border:1px solid rgba(227,196,127,.3)}
.toast svg{width:18px;height:18px;color:var(--gold-lt)}

/* ---------- AI assistant ---------- */
.ai-fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;align-items:center;gap:10px;height:60px;padding:0 22px 0 8px;border-radius:999px;background:var(--navy);color:#fff;box-shadow:0 14px 40px -12px rgba(7,17,43,.6);border:1px solid rgba(227,196,127,.45);transition:transform .2s}
.ai-fab:hover{transform:translateY(-2px)}
.ai-fab .av{width:44px;height:44px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--navy-deep);position:relative}
.ai-fab .av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--gold-lt);animation:ripple 2.4s infinite}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
.ai-fab .av svg{width:22px;height:22px}
.ai-fab b{font-weight:500;font-size:15px;display:block;line-height:1.1}
.ai-fab small{font-size:12px;color:var(--gold-lt);display:block}
.chat{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:100;width:410px;height:min(680px,calc(100vh - 44px));background:var(--ivory);border-radius:24px;box-shadow:0 30px 80px -20px rgba(7,17,43,.55);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;animation:chatIn .35s cubic-bezier(.2,.9,.3,1);border:1px solid var(--line)}
@keyframes chatIn{from{transform:scale(.85);opacity:0}}
.chat .ch{background:var(--navy);color:#fff;padding:16px 16px 14px 18px;display:flex;align-items:center;gap:12px}
.chat .ch .av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--navy-deep);display:grid;place-items:center;flex-shrink:0}
.chat .ch .av svg{width:22px;height:22px}
.chat .ch b{font-family:var(--serif);font-weight:500;font-size:20px;display:block;line-height:1.1}
.chat .ch small{font-size:12px;color:var(--gold-lt);display:flex;align-items:center;gap:6px}
.chat .ch small i{width:6px;height:6px;border-radius:50%;background:#5BD08A}
.chat .ch .x{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.chat .ch .x:hover{background:rgba(255,255,255,.1)}
.langs{display:flex;gap:4px;padding:8px 14px;background:var(--navy-2)}
.langs button{flex:1;height:30px;border-radius:999px;font-size:13px;color:rgba(255,255,255,.75)}
.langs button.on{background:var(--gold-pale);color:var(--navy-deep)}
.cbody{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.cbody .bub{max-width:88%}
.cbody>*{flex-shrink:0}
.cbody .bub.b{background:#fff;border:1px solid var(--line)}
.recs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:thin}
.rec{flex:0 0 170px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}
.rec .t{aspect-ratio:1;cursor:pointer;background:var(--white)}
.rec .b{padding:10px}
.rec .b b{font-family:var(--serif);font-weight:500;font-size:15px;display:block;line-height:1.2;cursor:pointer}
.rec .b .p{font-weight:600;margin-top:4px}
.rec .b .why{color:var(--muted);font-size:12px;margin-top:2px}
.rec .acts{display:flex;gap:4px;margin-top:8px}
.rec .acts button{flex:1;height:30px;border-radius:999px;font-size:12px;border:1px solid var(--line-n)}
.rec .acts button.pr{background:var(--navy);color:#fff;border-color:var(--navy)}
.typing{display:flex;gap:4px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;align-self:flex-start}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25;transform:translateY(-2px)}}
.qs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.qs::-webkit-scrollbar{display:none}
.qs button{flex-shrink:0;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-dk);font-size:13px;background:#fff}
.qs button:hover{background:var(--gold-pale)}
.cin{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line);background:#fff}
.cin input{flex:1;height:46px;border-radius:999px;border:1px solid var(--line-n);padding:0 18px;background:var(--ivory)}
.cin input:focus{outline:none;border-color:var(--gold)}
.cin button{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex-shrink:0}
.cin button svg{width:20px;height:20px}
.cacts{display:flex;gap:6px;flex-wrap:wrap}
.cacts button{height:32px;padding:0 12px;border-radius:999px;background:var(--navy);color:#fff;font-size:12.5px}

/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:#F5F3EE}
.aside{background:var(--navy-deep);color:rgba(255,255,255,.78);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.aside .logo{padding:0 8px 22px;border-bottom:1px solid rgba(227,196,127,.14);margin-bottom:12px}
.aside .logo .wm b{font-size:20px}
.aside button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;font-size:14.5px;text-align:left}
.aside button svg{width:18px;height:18px;opacity:.75}
.aside button:hover{background:rgba(255,255,255,.05);color:#fff}
.aside button.on{background:rgba(227,196,127,.14);color:var(--gold-lt)}
.aside button .n{margin-left:auto;font-size:11px;background:var(--gold);color:var(--navy-deep);border-radius:999px;padding:1px 7px;font-weight:600}
.aside .sep{font-size:12px;color:rgba(255,255,255,.4);padding:16px 12px 6px}
.amain{padding:26px 34px 60px;min-width:0}
.atop{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.atop h1{font-size:34px}
.atop p{color:var(--muted);font-size:14px}
.atop .who{display:flex;align-items:center;gap:10px;font-size:14px}
.atop .who .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold-lt);display:grid;place-items:center;font-family:var(--serif)}
.acard{background:#fff;border:1px solid var(--line-n);border-radius:16px;padding:22px}
.acard h3{font-family:var(--sans);font-size:16px;font-weight:500;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.agrid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:2fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.tblw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line-n);white-space:nowrap}
table.t td{padding:12px;border-bottom:1px solid var(--line-n);vertical-align:middle}
table.t tr:hover td{background:#FBFAF6}
table.t .th{width:42px;height:42px;border-radius:8px;overflow:hidden;background:var(--ivory)}
table.t select{height:32px;border-radius:8px;border:1px solid var(--line-n);padding:0 8px;background:#fff;font-size:13px}
.stock{height:6px;border-radius:3px;background:var(--ivory-2);overflow:hidden;width:100px}
.stock i{display:block;height:100%;background:var(--ok)}
.stock i.lo{background:var(--ruby)}
.tog{width:42px;height:24px;border-radius:12px;background:#D6D3CB;position:relative;transition:background .2s;flex-shrink:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--ok)}
.tog.on::after{transform:translateX(18px)}
.perm-t td{text-align:center}
.perm-t td:first-child{text-align:left}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted)}
.bars .b i{display:block;width:100%;max-width:38px;background:var(--navy);border-radius:6px 6px 0 0;transition:height .6s}
.bars .b i.g{background:var(--gold)}
.hbar{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:10px}
.hbar span:first-child{width:110px;flex-shrink:0}
.hbar .tr{flex:1;height:10px;background:var(--ivory-2);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--gold);border-radius:5px}
.reqc{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line-n)}
.reqc .t{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--ivory)}
.reqc .t img{width:100%;height:100%;object-fit:cover}
.bannerprev{border-radius:14px;overflow:hidden;background:var(--navy);color:#fff;padding:26px;position:relative;min-height:180px}
.bannerprev h4{font-size:28px;max-width:70%}
.atabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.amob{display:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  nav.main a{padding:8px 8px;font-size:14px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .cat-rail{grid-template-columns:repeat(4,1fr)}
  .mega .wrap{grid-template-columns:repeat(4,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  :root{--hdr:60px}
  nav.main,.strip .right,.hdr-icons .hide-m{display:none}
  .burger{display:grid}
  .hdr .wrap{gap:8px}
  .logo{margin-right:auto}
  .logo svg{width:30px;height:30px}
  .logo .wm b{font-size:20px}
  .hero .wrap{grid-template-columns:1fr;padding:30px 0 40px;gap:10px;min-height:0}
  .hero-art{order:-1;max-width:420px;margin-bottom:-10px}
  .hero-art .tag{padding:8px 10px;font-size:11.5px}
  .hero-art .tag b{font-size:14px}
  .hero-art .tag .mini{width:44px;height:44px}
  .hero-art .tag.t1{left:0}
  .hero-art .tag.t2{right:0;top:6%}
  .hero p.lead{font-size:16px}
  .hero .ctas .btn{flex:1}
  .trust .wrap{grid-template-columns:repeat(2,1fr);font-size:13px}
  section.s{padding:60px 0}
  .s-head{flex-direction:column;align-items:flex-start}
  .duo,.duo2,.festive .wrap,.goldbox,.colls,.quotes,.pdp,.cartg,.two,.acct,.stores,.shop{grid-template-columns:1fr}
  .feat{min-height:420px}
  .feat.ar .vis{left:30%;opacity:.9}
  .feat .copy{padding:28px}
  .feat.ar .copy{background:linear-gradient(90deg,rgba(12,27,63,.95) 40%,rgba(12,27,63,.2))}
  .festive .wrap{padding:60px 0}
  .festive .art{order:-1;max-width:340px}
  .colls{grid-template-columns:1fr;gap:14px}
  .coll{aspect-ratio:16/11}
  .goldbox .l,.goldbox .r{padding:26px}
  .grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}
  .pc .nm{font-size:16px}
  .pc .try{opacity:1;transform:none;height:28px;font-size:11.5px}
  .filters{position:fixed;inset:0;z-index:95;background:var(--ivory);padding:20px;max-height:none;transform:translateY(100%);transition:transform .35s;top:0}
  .filters.open{transform:none}
  .fbtn{display:inline-flex}
  .gal{position:static;grid-template-columns:1fr}
  .thumbs{flex-direction:row;order:2;overflow-x:auto}
  .thumbs button{width:72px;flex-shrink:0}
  .pdp{gap:24px;padding-top:16px}
  .specs{grid-template-columns:repeat(2,1fr)}
  .summary,.side-nav{position:static}
  .side-nav{flex-direction:row;overflow-x:auto}
  .side-nav button{white-space:nowrap}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tryon .wrap{grid-template-columns:1fr;padding:12px 0 30px;width:min(100% - 24px,1280px)}
  .tstage{width:100%}
  .paygrid{grid-template-columns:repeat(2,1fr)}
  .slots{grid-template-columns:repeat(3,1fr)}
  .mapv{min-height:340px}
  .ft .cols{grid-template-columns:1fr 1fr}
  footer.ft{padding-bottom:150px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--navy);border-top:1px solid rgba(227,196,127,.25);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:rgba(255,255,255,.7);padding:4px 0;position:relative}
  .bnav a svg{width:22px;height:22px}
  .bnav a.act{color:var(--gold-lt)}
  .bnav a.mid .c{width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--navy-deep);display:grid;place-items:center;margin-top:-26px;border:4px solid var(--navy);box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .bnav a.mid{color:var(--gold-lt)}
  .bnav .cnt{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:var(--navy-deep);font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
  .ai-fab{bottom:calc(82px + env(safe-area-inset-bottom,0px));right:14px;height:54px;padding:0 6px}
  .ai-fab .txt{display:none}
  .chat{inset:0;width:auto;height:auto;border-radius:0;bottom:0;right:0;padding-top:env(safe-area-inset-top,0px)}
  .toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px));width:90%}
  .admin{grid-template-columns:1fr}
  .aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:100;transform:translateX(-100%);transition:transform .3s}
  .aside.open{transform:none}
  .amob{display:flex;align-items:center;gap:12px;background:var(--navy-deep);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:60}
  .amain{padding:20px 16px 60px}
  .g3,.g2,.g11{grid-template-columns:1fr}
  .typegrid{grid-template-columns:repeat(4,1fr)}
  .experts{grid-template-columns:repeat(3,1fr)}
  .fgrid{grid-template-columns:1fr}
}
@media (max-width:520px){
  .wrap{width:min(1280px,100% - 28px)}
  .cat-rail{grid-template-columns:repeat(4,1fr);gap:12px}
  .cat-rail span{font-size:14px}
  .cat-rail small{display:none}
  .g4{grid-template-columns:1fr 1fr}
  .kpi b{font-size:24px}
  .citem{grid-template-columns:84px 1fr;gap:14px}
  .citem > :last-child{grid-column:2}
  .countdown div{min-width:0;flex:1;padding:10px 6px}
  .strip .rates .hide-s{display:none}
  .typegrid{grid-template-columns:repeat(4,1fr)}
  .typegrid button{font-size:11.5px}
  .typegrid button .t{width:44px;height:44px}
  .experts{grid-template-columns:1fr}
  .zone button{font-size:10.5px}
  .tlist{grid-template-columns:repeat(4,1fr)}
}

/* ============ BRIGHT & AIRY THEME ============ */
:root{--ivory:#FFFFFF;--ivory-2:#F7F2EA;--paper:#FBF8F3;--blush:#F8EEE6;--line:rgba(184,137,60,.24)}
body{background:#fff}
.logo{color:var(--gold)}
.strip{background:var(--blush);color:var(--ink)}
.strip b{color:var(--navy)}
.strip .right a:hover,.strip .right button:hover{color:var(--gold-dk)}
.strip [data-a=lang]{color:var(--gold-dk)!important}
header.hdr{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--ink);border-bottom:1px solid var(--line)}
.logo .wm b{color:var(--navy)}
.logo .wm small{color:var(--gold-dk)}
nav.main a{color:var(--ink)}
nav.main a:hover,nav.main a.act{color:var(--gold-dk)}
nav.main a.act::after{content:"";position:absolute;left:12px;right:12px;bottom:-14px;height:2px;background:var(--gold)}
nav.main a .ar{background:var(--navy);color:var(--gold-lt)}
.ico{color:var(--navy)}
.ico:hover{background:var(--ivory-2);color:var(--gold-dk)}
.search-bar{background:var(--paper);border-top:1px solid var(--line)}
.search-bar input{background:#fff;color:var(--ink);border-color:var(--line)}
.search-bar input::placeholder{color:var(--muted)}
.mega{background:#fff}
.drawer .panel{background:#fff;color:var(--ink)}
.drawer .panel a{border-color:var(--line)}
.drawer .panel h4{color:var(--gold-dk)}
.drawer .cats .t{background:var(--paper)}
.drawer .btn-ghost-l{color:var(--navy);border-color:var(--line)}
/* hero */
.hero{background:var(--paper);color:var(--ink)}
.hero .jali{opacity:.05;color:var(--gold)}
.hero h1{color:var(--navy)}
.hero .kick{color:var(--gold-dk)}
.hero p.lead{color:var(--muted)}
.hero .btn-gold{background:var(--navy)}
.hero .btn-gold:hover{background:var(--navy-2)}
.hero .btn-ghost-l{color:var(--navy);border-color:rgba(12,27,63,.3)}
.hero .btn-ghost-l:hover{background:#fff}
.hero .assist{background:#fff;border-color:var(--line);box-shadow:0 10px 30px -18px rgba(12,27,63,.25)}
.hero .assist:hover{border-color:var(--gold)}
.hero .assist .q{color:var(--ink)}
.hero .assist .q > span:last-child{color:var(--muted)}
.hero .assist .typed{border-color:var(--gold)}
.arch{position:absolute;inset:0;border-radius:50% 50% 28px 28px / 36% 36% 28px 28px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fff,#F1E8DA 75%);box-shadow:0 30px 70px -40px rgba(12,27,63,.45);border:1px solid var(--line)}
.arch::after{content:"";position:absolute;inset:10px;border-radius:inherit;border:1px solid rgba(184,137,60,.35);pointer-events:none;z-index:2}
.arch .main{position:absolute;inset:6% 2% 0}
.arch img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.hero-art{aspect-ratio:4/4.7;max-width:520px}
.hero-art .tag{border:1px solid var(--line);background:#fff;z-index:3}
.hero-art .tag.t1{left:-8%;bottom:10%}
.hero-art .tag.t2{right:-6%;top:16%}
.trust{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.trust svg{color:var(--gold-dk)}
/* photos */
.phw{position:relative;display:block;width:100%;height:100%}
.phw > svg{width:100%;height:100%}
img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#F7F3EE;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
img.ph.v1{transform:scale(1.18) rotate(-4deg)}
img.ph.v2{transform:scale(1.9)}
img.ph.v3{filter:sepia(.25) saturate(1.2) brightness(.92)}
.pc:hover .img img.ph{transform:scale(1.06)}
.coll .bg img.ph{z-index:0}
.festive .art .arch{background:radial-gradient(circle at 50% 70%,#FFF4E2,#F3E3C8 80%)}
.festive .art{aspect-ratio:4/4.6;max-width:460px}
.festive .art .arch > svg{position:absolute;inset:4% 0 0}
/* cards */
.pc .img{background:#F8F5F0;border-color:transparent;border-radius:16px;transition:box-shadow .3s}
.pc:hover .img{box-shadow:0 18px 40px -24px rgba(12,27,63,.35)}
.pc .wl{box-shadow:0 2px 8px rgba(12,27,63,.1)}

function applyFilters(){const F=S.filters;let l=P.filter(p=>{const pr=price(p).total;
  if(F.cat.length&&!F.cat.includes(p.cat))return false;
  if(F.metal.length&&!F.metal.includes(p.metal))return false;
  if(F.purity.length&&!F.purity.includes(p.purity))return false;
  if(F.occ.length&&!p.occ.some(o=>F.occ.includes(o)))return false;
  if(F.gender.length&&!F.gender.includes(p.gender)&&!(p.gender==='unisex'))return false;
  if(F.gem.length&&!F.gem.includes(p.gem))return false;
  if(F.price&&F.price.length&&!F.price.some(k=>{const b=PB.find(x=>x[0]===k);return pr>=b[2]&&pr<b[3]}))return false;
  if(F.coll&&p.coll!==F.coll)return false;
  if(F.q){const q=F.q.toLowerCase();if(!(p.name+' '+p.cat+' '+CATN[p.cat]+' '+GEMN[p.gem]+' '+p.purity+' '+METALN[p.metal]).toLowerCase().includes(q))return false}
  return true});
 const s=S.sort;l.sort((a,b)=>s==='lo'?price(a).total-price(b).total:s==='hi'?price(b).total-price(a).total:s==='new'?(b.tag==='New')-(a.tag==='New'):b.rev-a.rev);return l}

 if(/^(hi|hello|hey|namaste|नमस्ते)\b/i.test(s.trim())&&!r.cat&&!r.budget)return{L,text:GREET[L]};

function readFiles(files){[...files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=240/Math.max(img.width,img.height);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.cu.imgs.push(c.toDataURL('image/jpeg',.8));$('#prev').innerHTML=S.cu.imgs.map(s=>`<img src="${s}" alt="Reference">`).join('');toast('Reference added','img')};img.src=r.result};r.readAsDataURL(f)})}
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');readFiles(e.dataTransfer.files)}});
/* zoom */
document.addEventListener('mousemove',e=>{const st=e.target.closest('#stage');if(!st||st.dataset.zoom!=='1')return;const r=st.getBoundingClientRect(),z=$('#zin');z.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`});
document.addEventListener('mouseover',e=>{const st=e.target.closest('#stage');if(st&&st.dataset.zoom==='1'&&matchMedia('(hover:hover)').matches)st.classList.add('zoomed')});
document.addEventListener('mouseout',e=>{const st=e.target.closest('#stage');if(st&&!st.contains(e.relatedTarget))st.classList.remove('zoomed')});
document.addEventListener('click',e=>{const st=e.target.closest('#stage');if(st&&st.dataset.zoom==='1'&&!matchMedia('(hover:hover)').matches){const r=st.getBoundingClientRect();$('#zin').style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;st.classList.toggle('zoomed')}});
/* 360 drag */
let spin=null;document.addEventListener('pointerdown',e=>{const st=e.target.closest('#stage.r360');if(!st||e.target.closest('.spin-ctl'))return;spin={x:e.clientX,v:+($('[data-in=spin]').value)}});
document.addEventListener('pointermove',e=>{if(!spin)return;const s=$('[data-in=spin]');let v=spin.v+(e.clientX-spin.x)*.8;v=((v+180)%360+360)%360-180;s.value=v;s.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('pointerup',()=>spin=null);
/* hero typing + countdown */
const TYPED=['Gift for my wife under ₹30,000','Mummy ke liye jhumke 50k tak','शादी के लिए हल्का हार','Daily wear diamond studs','Men’s kada for Diwali'];let ti=0;
setInterval(()=>{const el=$('#typed');if(!el)return;ti=(ti+1)%TYPED.length;el.textContent=TYPED[ti];el.closest('.assist').dataset.q=TYPED[ti]},3400);
setInterval(()=>{const el=$('#cd');if(!el)return;const end=new Date(2026,10,11,23,59),now=new Date(),d=Math.max(0,end-now);const D=Math.floor(d/864e5),H=Math.floor(d/36e5)%24,M=Math.floor(d/6e4)%60,Sx=Math.floor(d/1e3)%60;el.innerHTML=[[D,'days'],[H,'hours'],[M,'mins'],[Sx,'secs']].map(x=>`<div><b>${String(x[0]).padStart(2,'0')}</b><span>${x[1]}</span></div>`).join('')},1000);

S.lang=S.ui==='hi'?'hi':'en';
render();
